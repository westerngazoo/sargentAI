[package]
name = "fitai-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true   # inherits workspace value (false)

[lib]
path = "src/lib.rs"

[[bin]]
name = "fitai-api"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["multipart"] }
# `sync` + `time`: the mail seam's RecordingMailer waits on a Notify with a
# timeout (SPEC-0060 §2.3).
tokio = { workspace = true, features = ["sync", "time"] }
bytes.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
fitai-core.workspace = true
sqlx.workspace = true
argon2.workspace = true
sha2.workspace = true
jsonwebtoken.workspace = true
uuid.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
validator.workspace = true
eyre.workspace = true
tower-http.workspace = true
# R-0032 — USDA FoodData Central nutrient lookup (nutrition/foods.rs).
reqwest.workspace = true
regex = "1"
ort.workspace = true
image.workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
reqwest.workspace = true
# `no-env-filter`: by default tracing-test captures only the test crate's own
# logs, so assertions about what *fitai_api* logs (no plaintext password, no
# reset token, the send-failure line — R-0002 AC6, R-0060 AC2/AC6) would
# pass vacuously. With it, the capture sees every crate.
tracing-test = { workspace = true, features = ["no-env-filter"] }
# R-0006 / SPEC-0006 §2.7 — the photo-session object-store seam test root.
# (`bytes` is now a production dependency, available to tests too.)
tempfile = "3"
