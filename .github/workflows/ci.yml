name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

env:
  ONNXRUNTIME_VERSION: 1.24.2
  # SHA-256 of Microsoft's official NuGet package Microsoft.ML.OnnxRuntime
  # (one package, both linux-x64 and linux-arm64). The GitHub release assets
  # stopped resolving on 2026-11-21 (github.com/microsoft/onnxruntime → 404).
  ONNXRUNTIME_NUPKG_SHA256: 782564d3d68e87269ea1812cc94710ad06fe014faf093f01a6f89d0bd58719d3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel main runs; a fast-follow merge must still record a green build.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fitai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fitai_ci
      JWT_SECRET: ci-only-test-secret
    steps:
      - uses: actions/checkout@v4
      - name: cache ONNX Runtime package
        id: cache-onnx
        uses: actions/cache@v4
        with:
          path: /tmp/ort.nupkg
          key: onnxruntime-nupkg-${{ env.ONNXRUNTIME_VERSION }}-${{ env.ONNXRUNTIME_NUPKG_SHA256 }}
      - name: install ONNX Runtime (for ort system linking)
        run: |
          set -euo pipefail
          if [ ! -f /tmp/ort.nupkg ]; then
            curl --proto '=https' --tlsv1.2 -fsSL \
              "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/${ONNXRUNTIME_VERSION}/microsoft.ml.onnxruntime.${ONNXRUNTIME_VERSION}.nupkg" \
              -o /tmp/ort.nupkg
          fi
          echo "${ONNXRUNTIME_NUPKG_SHA256}  /tmp/ort.nupkg" | sha256sum -c -
          sudo scripts/ort-from-nupkg.sh /tmp/ort.nupkg x64 "${ONNXRUNTIME_VERSION}" /opt/onnxruntime
          {
            echo "ORT_STRATEGY=system"
            echo "ORT_LIB_LOCATION=/opt/onnxruntime/lib"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "LD_LIBRARY_PATH=/opt/onnxruntime/lib:${LD_LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
      - name: install toolchain
        run: rustup show  # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --workspace --all-targets --locked

  mobile:
    name: mobile (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # `flutter-version-file` pointing at a bare `.flutter-version` was NOT
      # honoured: `channel: stable` won and CI silently installed whatever
      # stable was current (3.47.2 on 2026-09-04, against a 3.44.9 pin). Read
      # the pin ourselves and pass it as an explicit version, so the file stays
      # the single source of truth and cannot be quietly ignored.
      - id: flutter-pin
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}
      # Assert the pin actually took. The lockfile guard below only catches the
      # SYMPTOM of an unpinned toolchain; nothing was checking the pin itself,
      # so a new stable release turned every PR red with a truthful-looking but
      # misleading lockfile error.
      - name: assert the pinned SDK is the one installed
        run: |
          want="$(cat .flutter-version)"
          got="$(flutter --version | head -1 | awk '{print $2}')"
          if [ "$want" != "$got" ]; then
            echo "::error::Flutter pin is $want but CI installed $got"
            exit 1
          fi
          echo "Flutter $got matches the pin"
      # Plain `flutter pub get` rewrites pubspec.lock in place and accepts any
      # already-valid resolution, so a lock resolved on a different SDK is
      # silently tolerated and the job goes green on a lockfile that never
      # matched the pinned toolchain. --enforce-lockfile fails instead.
      - run: flutter pub get --enforce-lockfile

      # gen-l10n rewrites lib/l10n/*.dart on pub get. The generated files are
      # committed, so an ARB edited without regenerating must fail here, not
      # pass green with a stale checkout (SPEC-0061 §2.9).
      - name: generated localizations are up to date
        working-directory: mobile
        run: git diff --exit-code -- lib/l10n
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build backend image
        run: |
          docker build -t fitai-api:ci \
            --build-arg ONNXRUNTIME_VERSION="${ONNXRUNTIME_VERSION}" \
            --build-arg ONNXRUNTIME_NUPKG_SHA256="${ONNXRUNTIME_NUPKG_SHA256}" \
            backend
