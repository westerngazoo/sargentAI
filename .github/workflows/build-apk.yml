# Build an installable Android APK on CI.
#
# Why CI rather than a laptop: `flutter build apk` needs a JDK, and the dev Mac
# has none ("Unable to locate a Java Runtime"), so `assembleRelease` fails
# there. GitHub runners ship one.
#
# The APK is uploaded as a workflow artifact — download it from the run page and
# sideload it. Note the release build is signed with the *debug* key (see the
# TODO in android/app/build.gradle.kts): fine for installing on your own device,
# not acceptable for Play Store distribution.
#
# API_BASE_URL is compile-time (AppConfig.apiBaseUrl reads it via
# String.fromEnvironment), so it must be baked in here. A build without it
# defaults to http://localhost:8080, which on a phone means the phone itself —
# the app would silently reach no API at all.

name: build apk

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL to compile into the app"
        required: true
        default: "https://fitai-api.gustavo-delgadillo.workers.dev"

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: flutter build apk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # See ci.yml: a bare `.flutter-version` is not honoured by
      # `flutter-version-file`; `channel` wins and the pin is silently ignored.
      - id: flutter-pin
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-pin.outputs.version }}

      - run: flutter pub get --enforce-lockfile

      - name: build release apk
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL='${{ inputs.api_base_url }}'

      # Guard against the failure mode this workflow exists to prevent: an APK
      # that silently talks to nothing because the define did not take.
      - name: verify the API base was compiled in
        run: |
          set -e
          apk=build/app/outputs/flutter-apk/app-release.apk
          unzip -p "$apk" assets/flutter_assets/kernel_blob.bin 2>/dev/null \
            | strings | grep -qF '${{ inputs.api_base_url }}' && ok=1 || ok=0
          if [ "$ok" = "1" ]; then
            echo "found '${{ inputs.api_base_url }}' in the bundle"
          else
            # Release builds are AOT-compiled, so the kernel blob may be absent;
            # fall back to scanning the whole APK.
            if unzip -p "$apk" '*' 2>/dev/null | strings | grep -qF '${{ inputs.api_base_url }}'; then
              echo "found '${{ inputs.api_base_url }}' in the APK"
            else
              echo "API base URL not found in the APK — the --dart-define did not take" >&2
              exit 1
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: sargent-ai-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
