name: fitai
description: "fitAI mobile client — thin: capture, display, no on-device inference."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.11.0
  flutter_secure_storage: ^9.2.4
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  flutter_svg: ^2.3.0
  google_sign_in: ^6.3.0
  audio_service: ^0.18.19
  just_audio: ^0.10.6
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
