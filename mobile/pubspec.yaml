name: fitai
description: "fitAI mobile client — thin: capture, display, no on-device inference."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  # R-0061 AC11 (SPEC-0061 §2.9): first-party localization. `intl: any`
  # follows flutter_localizations' exact pin; the lockfile fixes the version.
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.11.0
  flutter_secure_storage: ^9.2.4
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  flutter_svg: ^2.3.0
  google_sign_in: ^6.3.0
  audio_service: ^0.18.19
  just_audio: ^0.10.6
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  # gen-l10n (l10n.yaml) writes lib/l10n/app_localizations*.dart on pub get.
  generate: true
  assets:
    # The silent loop that holds the earbud foreground service open (R-0035).
    # The file was on disk but undeclared, so it was never bundled;
    # AudioServiceHandler._initAudio swallows the load failure by design, which
    # made a missing asset look identical to a working one at runtime.
    - assets/audio/silence.mp3
    # Font licences, shown on the licence page (SPEC-0061 §2.10).
    - assets/fonts/OFL-Bangers.txt
    - assets/fonts/LICENSE-LuckiestGuy.txt
    - assets/fonts/OFL-IBMPlexMono.txt
    - assets/fonts/OFL-Archivo.txt
  # The @fisicobuenfisico faces, bundled so nothing is fetched at run time.
  fonts:
    - family: Bangers
      fonts:
        - asset: assets/fonts/Bangers-Regular.ttf
    - family: LuckiestGuy
      fonts:
        - asset: assets/fonts/LuckiestGuy-Regular.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
